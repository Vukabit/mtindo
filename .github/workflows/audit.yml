# The dependency graph against advisories, licenses and sources (flow.toml's `audit`
# stage, deny.toml): weekly, when a manifest or the lock file changes, and by hand.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tools
        run: |
          rustup toolchain install
          cargo xtask bootstrap --go --for audit
      - name: Checks
        run: cargo xtask flow check audit
