# The dependency graph against advisories, licenses and sources (flow.toml's `audit`
# stage, deny.toml): weekly, when a manifest or the lock file changes, and by hand.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          rustup toolchain install
          cargo xtask bootstrap --go --for audit
      - name: Checks
        run: cargo xtask flow check audit
