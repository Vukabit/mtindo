# Every first-class target builds mto, runs its tests and measures what writing files
# costs there (`cargo xtask speed io`): each platform syncs its own way (src/durable).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch or pull request cancels the run it replaces; a tag's
# run always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux x86_64
          - os: ubuntu-24.04-arm
            target: linux aarch64
          - os: macos-15
            target: macos aarch64
          - os: windows-2025
            target: windows x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # rust-toolchain.toml's, with its components.
      - name: Toolchain
        run: rustup toolchain install
      # Dependencies and build output kept between runs, keyed by the lock file and toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --release --bin mto --bin cargo-mto
      # Clippy and every test suite (flow.toml's `build` stage), so one run shows every
      # system's failures.
      - name: Checks
        run: cargo xtask flow check build
      # The log keeps everything; the summary, which GitHub caps at 1 MB, its start.
      - name: What writing costs here
        run: |
          status=0
          cargo xtask speed io > io-bench.txt 2>&1 || status=$?
          cat io-bench.txt
          head -c 65536 io-bench.txt >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # The oldest Rust mto supports (`rust-version` in Cargo.toml, flow.toml's
  # [tools.msrv]) still builds and tests it.
  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchains
        run: |
          rustup toolchain install
          cargo xtask bootstrap --go --for msrv
      # Dependencies and build output kept between runs, keyed by the lock file and toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tests
        run: cargo xtask flow check msrv

  # The repository's own rules (flow.toml's `ci` stage): the pushed commits' messages,
  # no credentials or working notes, formatting, the gates, pinned actions.
  flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The whole history: the commits pushed are read from it, as are the metrics
      # papers' history tables.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Tools
        run: |
          rustup toolchain install
          cargo xtask bootstrap --go --for site
      # Dependencies and build output kept between runs, keyed by the lock file and toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A pull request's commits since its base; a push's since what the branch held
      # (a new branch, or history rewritten: since main).
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE..HEAD"
          elif [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="origin/main..HEAD"
          fi
          cargo xtask flow check ci --range "$range"

  # Instructions the release mto runs on a fixed workload, counted by Cachegrind
  # (`cargo xtask speed instructions`): the same from run to run, so a runner too noisy
  # for wall time still catches a few percent of slowdown.
  instructions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tools
        run: |
          rustup toolchain install
          sudo apt-get install --yes --no-install-recommends valgrind
      # Dependencies and build output kept between runs, keyed by the lock file and toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Count
        run: |
          status=0
          cargo xtask speed instructions > instructions.txt 2>&1 || status=$?
          cat instructions.txt
          { echo '```text'; cat instructions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
