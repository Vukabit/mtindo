# Every first-class target builds mto, runs its tests and measures what writing files
# costs there (`cargo xtask io bench`): each platform syncs its own way (src/durable).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux x86_64
          - os: ubuntu-24.04-arm
            target: linux aarch64
          - os: macos-15
            target: macos aarch64
          - os: windows-2025
            target: windows x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Clippy
        run: cargo clippy --package mtindo --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --bin mto --bin cargo-mto
      # Every suite runs, so one run shows every system's failures.
      - name: Tests
        run: cargo test --package mtindo --no-fail-fast
      # The log keeps everything; the summary, which GitHub caps at 1 MB, its start.
      - name: What writing costs here
        run: |
          status=0
          cargo xtask io bench > io-bench.txt 2>&1 || status=$?
          cat io-bench.txt
          head -c 65536 io-bench.txt >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # The oldest Rust mto supports (`rust-version` in Cargo.toml) still builds and tests it.
  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - name: Tests
        run: cargo test --package mtindo

  gates:
    runs-on: ubuntu-24.04
    steps:
      # The whole history: the metrics papers' history tables are read from it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Gates
        run: cargo xtask gates
