# A release tag (`cargo xtask flow release`) published: each target's binaries built and
# packed, the GitHub release made with them and the changelog's section (left a draft
# for the first release), then crates.io and the Homebrew tap, each once approved in its
# environment. Every step is a `cargo xtask flow` command; see MAINTAINING.md.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install --yes musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mto --bin cargo-mto
      - name: Pack
        run: cargo xtask flow package ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/mto-*
          if-no-files-found: error

  github:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The tags too: the first release is told apart by having none before it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The version agrees with the tag and the changelog, the crate builds as published;
      # then SHA256SUMS, notes.md and whether it is left a draft.
      - name: Prepare
        id: prepare
        run: cargo xtask flow prepare "$TAG"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ steps.prepare.outputs.draft }}
        run: |
          draft=()
          if [ "$DRAFT" = true ]; then draft=(--draft); fi
          gh release create "$TAG" dist/mto-* dist/SHA256SUMS \
            --verify-tag --title "mtindo ${TAG#v}" --notes-file dist/notes.md "${draft[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums
          path: dist/SHA256SUMS

  # crates.io's trusted publishing: a token minted for this run alone, nothing stored.
  crates-io:
    needs: github
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  homebrew:
    needs: github
    runs-on: ubuntu-24.04
    environment: homebrew
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sums
          path: dist
      # A pull request in the tap, with the token scoped to it alone.
      - name: Formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: cargo xtask flow tap "$TAG"
