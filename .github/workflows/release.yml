# A release tag (`cargo xtask flow release`) published: each target's binaries built and
# packed, the GitHub release made with them and the changelog's section (left a draft
# for the first release), then crates.io once approved in its environment. Every step is
# a `cargo xtask flow` command; see MAINTAINING.md.
#
# A `dry-run/` branch pushed runs the builds and the packing alone, publishes nothing,
# and tries the packed Linux binary, with the newest glibc it needs.
name: release

on:
  push:
    tags: ["v[0-9]*"]
    branches: ["dry-run/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04's glibc (2.35) is the oldest the Linux binaries run on.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mto --bin cargo-mto
      - name: Pack
        run: cargo xtask flow package ${{ matrix.target }}
      # Unpacked as a user gets it: both binaries and the files beside them, and where the
      # runner runs the target, its mto naming the version (a release build, from a tag).
      - name: Try the archive
        run: cargo xtask flow try-archive ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/mto-*
          if-no-files-found: error

  github:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # The build provenance attestation: signed for this run, recorded with GitHub.
      id-token: write
      attestations: write
    steps:
      # The tags too: the first release is told apart by having none before it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The version agrees with the tag and the changelog, the crate builds as published;
      # then the bill of materials, SHA256SUMS, notes.md and whether it is left a draft.
      - name: Prepare
        id: prepare
        run: cargo xtask flow prepare "$TAG"
      # Each archive and the bill of materials attested as built here, from this tag:
      # `gh attestation verify FILE --repo Vukabit/mtindo` checks one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mto-*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ steps.prepare.outputs.draft }}
        run: |
          draft=()
          if [ "$DRAFT" = true ]; then draft=(--draft); fi
          gh release create "$TAG" dist/mto-* dist/SHA256SUMS \
            --verify-tag --title "mtindo ${TAG#v}" --notes-file dist/notes.md "${draft[@]}"

  # crates.io's trusted publishing: a token minted for this run alone, nothing stored.
  crates-io:
    if: startsWith(github.ref, 'refs/tags/')
    needs: github
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  # The packing and checksums as a release makes them, without a tag or a release; and
  # the packed Linux binary run on mto's own sources, with the newest glibc it needs.
  dry-run:
    needs: build
    if: startsWith(github.ref, 'refs/heads/dry-run/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Prepare
        run: |
          cargo xtask flow prepare --dry-run
          cat dist/SHA256SUMS
      - name: The Linux binary
        run: |
          mkdir packed && tar -xzf dist/mto-*-x86_64-unknown-linux-gnu.tar.gz -C packed
          mto=$(ls packed/*/mto)
          "$mto" --version
          cp -r src copy
          # 0: nothing to change, 1: something would change; either way it ran.
          status=0
          "$mto" --check --no-history --unguarded copy > /dev/null || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          glibc=$(objdump -T "$mto" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "The x86_64 Linux binary needs $glibc or newer." | tee -a "$GITHUB_STEP_SUMMARY"
