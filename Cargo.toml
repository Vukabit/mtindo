[workspace]
members = ["xtask", "xtask/tools"]
exclude = ["fuzz"]

[package]
name = "mtindo"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "mto"
path = "src/main.rs"

[[bin]]
name = "cargo-mto"
path = "src/bin/cargo-mto.rs"

[dependencies]

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
assert_cmd = "2.0"
predicates = "3.1"
criterion = "0.5"

[[bench]]
name = "mtindo_bench"
harness = false
