[workspace]
members = ["xtask", "xtask/hub", "xtask/memst", "xtask/tools"]
exclude = ["fuzz"]

[package]
name = "mtindo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lays out the items of Rust files in a predictable order, safely: std only, verified before every write"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Vukabit/mtindo"
readme = "README.md"
keywords = ["formatter", "layout", "rust", "cli", "cargo-subcommand"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src", "/Cargo.toml", "/README.md", "/CREDITS.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/LICENSE-UNICODE"]

[[bin]]
name = "mto"
path = "src/main.rs"

[[bin]]
name = "cargo-mto"
path = "src/bin/cargo-mto.rs"

[dependencies]

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
assert_cmd = "2.0"
predicates = "3.1"
criterion = "0.5"

[[bench]]
name = "mtindo_bench"
harness = false

# One unit, optimized across every module at once: mto is mostly small functions calling
# each other across modules (the parser, the tree, the formatter), which only inline when
# they are compiled together. Unwinding stays: a bug failing on one file is caught there.
[profile.release]
lto = "fat"
codegen-units = 1
