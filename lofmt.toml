# lofmt configuration file

sort_alphabetically = true
group_impls = true
sort_imports = true
import_grouping = true
blank_lines_between_blocks = 1
max_width = 80
tab_width = 2

type_order = [
    "ModDecl",
    "UseDecl",
    "MacroDecl",
    "ConstDecl",
    "StaticDecl",
    "TraitDecl",
    "EnumDecl",
    "StructDecl",
    "ImplBlock",
    "FnDecl",
    "Unknown"
]
