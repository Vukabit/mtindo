# mto configuration file
layout = true
sort_alphabetically = true
group_impls = true
sort_imports = true
import_grouping = true
blank_lines_between_blocks = 1
type_order = [
  "ModDecl",
  "UseDecl",
  "MacroDecl",
  "MacroDef",
  "ConstDecl",
  "StaticDecl",
  "TypeAlias",
  "TraitDecl",
  "EnumDecl",
  "StructDecl",
  "Union",
  "ImplBlock",
  "ExternBlock",
  "FnDecl",
  "Unknown"
]

ignore_dirs = [
    ".git",
    "target",
    "node_modules",
    "vendor",
    "dist",
    ".venv",
    "fixtures",
    "cache"
]
