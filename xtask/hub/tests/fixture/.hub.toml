# A small project, to test the hub apart from any real one.

[hub]
name = "fixture"
start = "main"
min_width = 40

[theme]
fg = "#dddddd"
accent = "#e3a857"
dim = "#777777"
ok = "#8fc47f"
bad = "#e3716b"
sel = "#26303b"

[styles]
text = { fg = "fg" }
title = { fg = "accent", bold = true }
frame = { fg = "dim" }
selected = { bg = "sel" }
dim = { fg = "dim" }
key = { fg = "accent" }
tab = { fg = "accent", reverse = true }
ok = { fg = "ok" }
bad = { fg = "bad" }

[[source]]
name = "runs"
kind = "toml"
glob = "runs/*/run.toml"
computed = { took = "secs(started, ended)", steps = "len(step)" }

[[source]]
name = "series"
kind = "tsv"
glob = "metrics/*.tsv"
header = true
group = { by = "_name", list = ["value"], last = ["value", "unit"] }
computed = { change = "pct_change(value_list)" }

[[widget]]
id = "runs"
type = "table"
title = "RUNS"
source = "runs"
sort = ["-started"]
selectable = true
open = "run"
columns = [
  { header = "STATE", value = "{state}", width = 7, style = [ { when = "state == \"passed\"", style = "ok" }, { style = "bad" } ] },
  { header = "COMMAND", value = "{command}", width = "fill" },
  { header = "TOOK", value = "{took | duration}", width = 6, align = "right" },
  { header = "PEAK", value = "{peak_kb * 1024 | bytes}", width = 8, align = "right" },
]

[[widget]]
id = "series"
type = "sparklines"
title = "SERIES"
source = "series"
sort = ["_name"]
label = "{_name}"
values = "value_list"
text = "{value} {unit} ({change | num:1}%)"

[[widget]]
id = "gauges"
type = "gauges"
title = "GAUGES"
source = "series"
sort = ["_name"]
label = "{_name | pad:7}"
value = "value"
max = "if(unit == \"x\", 20, 1000)"
target = "if(unit == \"x\", 15, 950)"
text = "{value}"

[[widget]]
id = "detail"
type = "kv"
title = "RUN {row.id}"
source = "runs"
filter = "id == row.id"
pairs = [["command", "{command}"], ["state", "{state}"], ["steps", "{steps}"]]

[[widget]]
id = "output"
type = "log"
title = "OUTPUT"
path = "runs/{row.id}/output.log"
level = "ERROR"
styles = { ERROR = "bad" }
empty = "no output kept"

[[widget]]
id = "shell"
type = "terminal"
title = "SHELL"
command = "sh"

[[screen]]
id = "main"
title = "Main"
key = "1"
layout = { split = "rows", sizes = ["fill", 4, 4], children = ["runs", "series", "gauges"] }

[[screen]]
id = "run"
page = true
title = "{row.command}"
layout = { split = "rows", sizes = [5, "fill"], children = ["detail", "output"] }

[[action]]
id = "retry"
label = "retry"
key = "r"
on = "runs"
when = "sel.runs.state == \"failed\""
run = "echo {sel.runs.id}"

[[source]]
name = "commands"
kind = "commands"
run = "cat commands.json"

[[action]]
id = "wipe"
label = "wipe"
key = "w"
on = "runs"
confirm = "Wipe {sel.runs.id}?"
run = "true"

[palette]
source = "commands"
run = "tool {path} {args}"

[[widget]]
id = "file-a"
type = "file"
title = "A"
path = "commands.json"

[[widget]]
id = "file-b"
type = "file"
title = "B"
path = "commands.json"

[[widget]]
id = "file-c"
type = "file"
title = "C"
path = "commands.json"

[[screen]]
id = "shell"
title = "Shell"
key = "2"
layout = "shell"

[footer]
extra = [["{screens}", "screens"], ["{palette}", "run"]]

[[screen]]
id = "grid"
title = "Grid"
key = "3"
layout = { split = "columns", sizes = ["50%", "fill"], children = [
  { split = "rows", sizes = ["50%", "fill"], children = ["runs", "file-a"] },
  { split = "rows", sizes = ["30%", "fill"], children = ["file-b", "file-c"] } ] }
